name: daily-price-collection

on:
  schedule:
    # 06:17 UTC every day -- deliberately off the top of the hour, where GitHub commonly delays or
    # skips scheduled runs under load. The Okou agent workflow rebuilds and redeploys at 06:40 UTC,
    # so this collection lands first.
    - cron: "17 6 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: daily-price-collection
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      # Pure standard library: no dependency install step to break.
      - name: Collect today's prices
        run: python3 src/fetch_data.py --if-missing

      - name: Check provider pricing pages for drift
        run: python3 src/check_providers.py
        continue-on-error: true

      - name: Build the site
        run: python3 src/build_site.py --out site

      - name: Quality gate
        run: python3 src/qa_check.py --out site

      - name: Run tests
        run: python3 -m unittest discover tests

      - name: Commit the day's data
        run: |
          git config user.name "cloudcost-radar-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data api
          if git diff --cached --quiet; then
            echo "no data change to commit"
          else
            git commit -m "chore(data): daily snapshot $(date -u +%F)"
            git push origin HEAD:${{ github.ref_name }}
          fi

      - name: Verify today's collection is recorded
        run: |
          python3 - <<'PY'
          import json, pathlib, sys
          meta = json.loads(pathlib.Path("data/latest/meta.json").read_text())
          print("latest snapshot:", meta["date"], "| collected_at:", meta["collected_at"])
          print("upstream_unchanged:", meta.get("upstream_unchanged"),
                "| since:", meta.get("upstream_since"))
          if not meta.get("date"):
              sys.exit("no snapshot date recorded")
          PY

      - name: Upload the built site as a workflow artefact
        uses: actions/upload-artifact@v7
        with:
          name: site-${{ github.run_id }}
          path: site
          retention-days: 5
